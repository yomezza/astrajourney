name: NATS N2 DBA isolated PostgreSQL checks

# Runs only in GitHub Actions with a fresh test database; never uses the game DB.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nats-n2-dba.yml'
      - 'docs/operations/nats-n2-dba/**'
      - 'docs/ideas/nats-event-bus/dba/sql/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-a2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cosmos
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cosmos_n2_dba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmos -d cosmos_n2_dba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cosmos:test-only@127.0.0.1:5432/cosmos_n2_dba_test?sslmode=disable
      CHAT_ENABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable runner test tools
        run: |
          python -m pip install 'psycopg[binary]'
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Initialize actual Cosmic and Chat schema plus restricted roles
        run: |
          SEED_SCHEMA=nats_dba_test go run docs/operations/nats-n2-dba/seed.go
          SEED_SCHEMA=nats_dba_test_b go run docs/operations/nats-n2-dba/seed.go
      - name: Run D01-D26 SQL and EXPLAIN (isolated DB only)
        run: python docs/operations/nats-n2-dba/run_postgres.py
      - name: Existing Chat/N1 PostgreSQL regression tests (separate schemas)
        run: |
          go test ./internal/server/integration \
            -run '^(TestChat240Transactions|TestChat240RestrictedRole|TestChat240CorporateFencesAndCleanup|TestChat240LateCommittedOutbox|TestChat240SpatialPresence|TestChatN1.*)$' \
            -count=1 -timeout=12m -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nats-n2-dba-results
          path: docs/operations/nats-n2-dba/results/*
          if-no-files-found: warn
