<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" fill="none" role="img" aria-labelledby="np-right-title np-right-desc"><title id="np-right-title">Правая новостная голограмма</title><desc id="np-right-desc">Зеркальная каркасная проекция для динамических новостей.</desc>
<!-- news-component:begin -->

<defs>
<linearGradient id="np-right-mist" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7fd5ee" stop-opacity=".12"/><stop offset="1" stop-color="#174554" stop-opacity=".035"/></linearGradient>
<filter id="np-right-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<style>
@keyframes np-right-float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-5px)}}
@keyframes np-right-chase{to{stroke-dashoffset:-190}}
@keyframes np-right-materialize{from{opacity:0}to{opacity:1}}
.np-right-float{animation:np-right-float 7.5s ease-in-out infinite}
.np-right-dash{animation:np-right-chase 5.7s linear infinite}
.np-right-fade{animation:np-right-materialize 1.8s ease-out both}
@media(prefers-reduced-motion:reduce){.np-right-float,.np-right-dash,.np-right-fade{animation:none!important;transform:none!important}}
</style>
<g transform="translate(900 0) scale(-1 1)"><g class="np-right-float np-right-fade" stroke-linejoin="round" stroke-linecap="round">
