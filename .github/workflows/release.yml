name: Publish release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files
        run: |
          set -euo pipefail
          sha256sum -c downloads/SHA256SUMS
          test -f "release-notes/$RELEASE_TAG.md"
          found=false
          for suffix in '' '-planet' '-chat'; do
            if test -f "downloads/cosmosimulator${suffix}-${RELEASE_TAG}-windows-amd64.exe"; then
              found=true
            fi
          done
          test "$found" = true
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish Windows executable and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          executables=()
          for suffix in '' '-planet' '-chat'; do
            asset="downloads/cosmosimulator${suffix}-${RELEASE_TAG}-windows-amd64.exe"
            if test -f "$asset"; then
              executables+=("$asset")
            fi
          done
          gh release create "$RELEASE_TAG" \
            "${executables[@]}" \
            configs/cosmos.example.toml \
            configs/planet.example.toml \
            configs/chat.example.toml \
            downloads/SHA256SUMS \
            --verify-tag \
            --title "Cosmosimulator $RELEASE_TAG" \
            --notes-file "release-notes/$RELEASE_TAG.md"
