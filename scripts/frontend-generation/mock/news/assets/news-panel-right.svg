<rect x="278" y="198" width="4" height="10" fill="#dcb985" opacity=".8"/><rect x="286" y="191" width="4" height="17" fill="#dcb985" opacity=".7"/><rect x="294" y="185" width="4" height="23" fill="#dcb985" opacity=".9"/>
<!-- perimeter energy tracing -->
