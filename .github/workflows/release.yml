name: Publish release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    if: github.ref_name != 'v0.31.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine release scope
        id: scope
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYRELEASE'
          import json, os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          manifest = json.loads(Path(f'downloads/astra-journey-{tag}-build.json').read_text())
          services = {build['service'] for build in manifest['builds']}
          assert services and services <= {'cosmos','planet','chat','cdn','web'}
          assert manifest['tag'] == tag
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"graphics={str('assets' in manifest).lower()}\n")
              output.write(f"frontend={str('web' in manifest).lower()}\n")
          PYRELEASE
      - name: Verify release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum -c downloads/SHA256SUMS
          test -f "release-notes/$RELEASE_TAG.md"
          python3 - <<'PYRELEASE'
          import json, os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          manifest = json.loads(Path(f'downloads/astra-journey-{tag}-build.json').read_text())
          suffix = {'cosmos':'','planet':'-planet','chat':'-chat','cdn':'-cdn','web':'-web'}
          for build in manifest['builds']:
              assert build['goos'] == 'linux' and build['goarch'] == 'amd64'
              assert build['file'] == f"astra-journey{suffix[build['service']]}-{tag}-linux-amd64"
              assert Path('downloads',build['file']).is_file()
          PYRELEASE
      - name: Verify external graphics
        if: steps.scope.outputs.graphics == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/verify-asset-release.py "$RELEASE_TAG"
      - name: Verify external frontend
        if: steps.scope.outputs.frontend == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/verify-web-release.py "$RELEASE_TAG"
      - name: Publish selected Linux services and packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYRELEASE'
          import json, os, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          manifest_path = Path(f'downloads/astra-journey-{tag}-build.json')
          manifest = json.loads(manifest_path.read_text())
          services = {build['service'] for build in manifest['builds']}
          files = [str(Path('downloads',build['file'])) for build in manifest['builds']]
          files += [str(manifest_path),'downloads/SHA256SUMS']
          for key,index in [('assets','astra-journey-assets.json'),('web','astra-journey-web.json')]:
              if key in manifest:
                  files += [str(Path('downloads',manifest[key]['archive'])),str(Path('downloads',index))]
          configs = {'cosmos':'cosmos','planet':'planet','chat':'chat','cdn':'cdn','web':'web'}
          files += [f'configs/{configs[service]}.example.toml' for service in sorted(services)]
          full = services == set(configs)
          if full: files += ['configs/shared.example.toml']
          title = f'Astra Journey Web {tag}' if services == {'web'} else f'Astra Journey {tag}'
          args = ['gh','release','create',tag,*files,'--verify-tag','--title',title,'--notes-file',f'release-notes/{tag}.md']
          # Keep the last complete graphics-bearing release as the CDN discovery target.
          if not full: args += ['--latest=false']
          subprocess.run(args,check=True)
          PYRELEASE

  matrix-studio:
    if: github.ref_name == 'v0.31.2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and verify Linux release
        run: |
          python3 scripts/build-release.py v0.31.2 --platform linux --service cosmos --out dist/matrix
          go run ./cmd/astra-web-assets -tag v0.31.2 -out dist/matrix
          python3 scripts/verify-web-release.py v0.31.2 --directory dist/matrix
          cp docs/operations/matrix-studio-update.ru.md dist/matrix/UPDATE.ru.md
          git rev-parse HEAD > dist/matrix/SOURCE_COMMIT
          cd dist/matrix
          sha256sum astra-journey-v0.31.2-linux-amd64 astra-journey-web-*.zip astra-journey-web.json astra-journey-v0.31.2-build.json UPDATE.ru.md SOURCE_COMMIT > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.31.2 dist/matrix/* --verify-tag --latest=false             --title 'Astra Journey 0.31.2 — MATRIX × STUDIO'             --notes-file docs/operations/matrix-studio-update.ru.md
