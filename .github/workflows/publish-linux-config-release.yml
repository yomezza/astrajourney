name: Publish Linux Planet visit-check resilience fix
on:
  push:
    branches: [main]
    paths: ['.github/linux-release-request.json']
permissions:
  contents: write
concurrency:
  group: publish-linux-config-release
  cancel-in-progress: false
jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate requested tag
        run: |
          set -euo pipefail
          tag="$(python3 - <<'PY'
          import json,re
          with open('.github/linux-release-request.json',encoding='utf-8') as stream:
              request=json.load(stream)
          tag=request['tag']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag):
              raise SystemExit('invalid version tag')
          print(tag)
          PY
          )"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Run targeted Planet validation and frontend tests
        run: |
          set -euo pipefail
          go test ./internal/planetserver ./internal/server -run '^(TestVisitCheckGraceRetriesDatabaseTimeoutOnly|TestVisitCheckGraceNeverRetriesAuthorizationFailure|TestPlanetWebSocketLifetimeIgnoresHTTPRequestCancellation|TestPlanetWebSocketLifetimeReleaseCloses|TestPlanetHTTPServerDoesNotExpireHijackedWebSockets|TestCosmicHTTPDeadlinesKeepProxiedWebSocketsAlive)$' -count=1 -timeout=3m
          node --check internal/server/web/features/planet/visit.js
          node --test tests/ui/planet-liveness.test.mjs
      - name: Build Linux amd64 Cosmic and Planet from tested commit
        run: |
          set -euo pipefail
          python3 scripts/build-release.py "$RELEASE_TAG" --platform linux --service cosmos --service planet --source-ref "$GITHUB_SHA"
          (
            cd downloads
            sha256sum "astra-journey-$RELEASE_TAG-linux-amd64" \
                      "astra-journey-planet-$RELEASE_TAG-linux-amd64" \
                      "astra-journey-$RELEASE_TAG-build.json"
          ) > "$RUNNER_TEMP/SHA256SUMS"
      - name: Publish Linux release after successful tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Astra Journey 0.25.5 — стабилизация Planet при временных ошибках PostgreSQL

          - Planet при временном таймауте проверки визита больше не разрывает WebSocket с первой попытки.
          - Пока повторная серверная проверка не завершена, движение игрока приостановлено. В течение ограниченного периода выполняется восстановление; настоящие ошибки доступа/смены сессии остаются терминальными.
          - Браузерный журнал теперь включает lastServerErrorCode и отдельное сообщение Planet server error, позволяя отличить проблемы БД от истечения сессии или конфликтов эпох.
          - Изменений PostgreSQL-схемы, gameplay и Chat нет.
          - Linux amd64: обновить Cosmic и Planet; Chat v0.25.2 совместим.

          Если соединение продолжит обрываться, приложите значение lastServerErrorCode и серверную строку planet websocket ended. Не отправляйте cookie или токены.
          EOF
          gh release create "$RELEASE_TAG" \
            "downloads/astra-journey-$RELEASE_TAG-linux-amd64" \
            "downloads/astra-journey-planet-$RELEASE_TAG-linux-amd64" \
            "downloads/astra-journey-$RELEASE_TAG-build.json" \
            "$RUNNER_TEMP/SHA256SUMS" \
            configs/cosmos.example.toml \
            configs/planet.example.toml \
            configs/chat.example.toml \
            configs/shared.example.toml \
            --target "$GITHUB_SHA" \
            --title "Astra Journey $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
