<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" fill="none" role="img" aria-labelledby="np-ctrl-title np-ctrl-desc"><title id="np-ctrl-title">Все новости — управляющая проекция</title><desc id="np-ctrl-desc">Голографический шестиугольный элемент без фиксированной надписи, доступный для RU/EN.</desc>
<!-- news-component:begin -->

<defs>
<radialGradient id="np-ctrl-well"><stop stop-color="#53cfdb" stop-opacity=".14"/><stop offset=".7" stop-color="#39718f" stop-opacity=".06"/><stop offset="1" stop-color="#53cfd8" stop-opacity="0"/></radialGradient>
<filter id="np-ctrl-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
@keyframes np-ctrl-breathe{0%,100%{opacity:.45}50%{opacity:.8}}
@keyframes np-ctrl-trace{to{stroke-dashoffset:-220}}
@keyframes np-ctrl-hover{0%,100%{opacity:.45}50%{opacity:.75}}
.np-ctrl-signal{animation:np-ctrl-breathe 4.4s ease-in-out infinite}
.np-ctrl-trace{animation:np-ctrl-trace 6s linear infinite}
svg:hover .np-ctrl-hot{opacity:.95}
@media(prefers-reduced-motion:reduce){.np-ctrl-signal,.np-ctrl-trace{animation:none!important;transform:none!important}}
</style>
