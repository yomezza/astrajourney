<path d="M65 213 83 211 89 200M339 187 325 186 321 175M78 336 94 334M321 310 339 307" stroke="#dcb985" stroke-width="1.5" opacity=".76"/>
<path d="M87 234 318 207M91 321 326 297" stroke="#7fd5ee" stroke-width=".7" opacity=".27"/>
