name: UI contracts

on:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'web/**'
      - 'assets/**'
      - 'cmd/**'
      - 'tests/ui/**'
      - 'scripts/ci-check.py'
      - 'scripts/test-integration-shard.py'
      - '.github/workflows/ui-contracts.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'internal/**'
      - 'web/**'
      - 'assets/**'
      - 'cmd/**'
      - 'tests/ui/**'
      - 'scripts/ci-check.py'
      - 'scripts/test-integration-shard.py'
      - '.github/workflows/ui-contracts.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cosmos
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: astra_journey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmos -d astra_journey_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cosmos:test-only@127.0.0.1:5432/astra_journey_test?sslmode=disable
    defaults:
      run:
        working-directory: tests/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: python3 ../../scripts/ci-check.py --log /tmp/astra-ui-contracts.log -- npm test
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Terminal browser against real Go and PostgreSQL
        working-directory: .
        run: |
          if go test ./internal/server/integration -run '^(TestCDNProductionBrowserCache290|TestTerminalBrowser|TestWorkspacesProductionBrowser|TestPlanetBrowser180|TestPlanetWalkingBrowser257|TestPlanetTransitionsBrowser210|TestDiscoveryGuidePlanetBrowser250|TestChat240FiftyConnections|TestGalaxyEditorBrowser|TestNotificationsCompactBrowser)$' -count=1 -timeout=5m -v > /tmp/astra-browser.log 2>&1; then
            cat /tmp/astra-browser.log
          else
            cat /tmp/astra-browser.log
            python3 - <<'PYDIAG'
          import re
          from pathlib import Path
          lines = Path('/tmp/astra-browser.log').read_text().splitlines()
          evidence = [line for line in lines if re.search(r'--- FAIL:|Error:|AssertionError|Timeout|waiting for|actual:|expected:|at .*mjs:', line)]
          message = '\n'.join(evidence[-70:]) or 'Browser integration failed; see job output'
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYDIAG
            exit 1
          fi
        env:
          RUN_CDN_BROWSER: '1'
          RUN_TERMINAL_BROWSER: '1'
          RUN_WORKSPACES_BROWSER: '1'
          RUN_PLANET_BROWSER: '1'
          RUN_DISCOVERY_BROWSER: '1'
          RUN_CHAT_BROWSER: '1'
          RUN_GALAXY_EDITOR_BROWSER: '1'
          RUN_NOTIFICATIONS_BROWSER: '1'
  server-contracts:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cosmos
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: astra_journey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmos -d astra_journey_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cosmos:test-only@127.0.0.1:5432/astra_journey_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 scripts/ci-check.py --log /tmp/astra-server-contracts.log -- python3 scripts/test-integration-shard.py --index ${{ matrix.shard }} --count 4
        env:
          CHAT_BACKUP_DOCKER_CONTAINER: ${{ job.services.postgres.id }}
      - if: matrix.shard == 0
        run: go test -race ./... -count=1 -timeout=12m -run '^(TestConcurrentLogistics080|TestLastHullPurchase040|TestBatchLogistics100|TestOpenDoesNotInitializeGame|TestDatabaseConfig|TestColdCacheSaturatedPool|TestBenchmarkCompositionIsolation|TestPlanetFoundation150|TestPlanetSchema150|TestPlanetFencing150|TestPlanetRestrictedRole150|TestLandingBackfillAndConcurrentCompletion160|TestLocalScenes170|TestLocalSceneFencingAndSourceCAS170|TestLocalSceneRetirement170|TestRegistry.*|TestPlanetHandoff180|TestPlanetTicketRecovery180|TestPlanetCorporateAndAtomicActivation180|TestAdminServices200|TestPlanetTransitions210|TestPlanetTransitionRevocation210|TestPlanetTransitionCapacity210|TestPlanetPresence200|TestPlanetDatabaseRecovery200|TestSectorPresenceCoalesces|TestSlowStreamDeadline|TestPlanetMovement190|TestPlanetCheckpoints190|TestMovementDistanceAndLifecycle|TestLatestGoalAndPermit|TestBoundedPathsAndCorners|TestConcurrentBoundedObservations|TestServiceMetrics230|TestAuthoritativeFacing220|TestChat240Transactions|TestChat240CorporateFencesAndCleanup|TestChat240LateCommittedOutbox|TestChat240FiftyConnections|TestChat240SpatialPresence)$'
      - if: matrix.shard == 0
        run: go vet ./...

  matrix-release-candidate:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/matrix-studio-workspaces'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Cosmic and Web assets
        run: |
          python3 scripts/build-release.py v0.31.2 --platform linux --service cosmos --out dist/matrix
          go run ./cmd/astra-web-assets -tag v0.31.2 -out dist/matrix
          python3 scripts/verify-web-release.py v0.31.2 --directory dist/matrix
          cp docs/operations/matrix-studio-update.ru.md dist/matrix/UPDATE.ru.md
          git rev-parse HEAD > dist/matrix/SOURCE_COMMIT
          cd dist/matrix
          sha256sum astra-journey-v0.31.2-linux-amd64 astra-journey-web-*.zip astra-journey-web.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: astra-journey-v0.31.2-linux-amd64
          path: dist/matrix/
          if-no-files-found: error
