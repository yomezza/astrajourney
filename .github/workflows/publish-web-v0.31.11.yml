name: Publish MATRIX × STUDIO Web v0.31.11

on:
  push:
    branches: [chore/publish-web-v0.31.11]

permissions:
  contents: write

concurrency:
  group: publish-web-v0.31.11

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify and publish Web assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.31.11
          source_commit=$(git rev-parse HEAD^)
          out="$RUNNER_TEMP/matrix-web"
          go run ./cmd/astra-web-assets -root web -tag "$tag" -out "$out"
          python3 scripts/verify-web-release.py "$tag" --directory "$out"
          archive="$out/astra-journey-web-845d19cfd62a33d21ec47c83202e519cf67dc61d35e0042f92182530f7a3620a.zip"
          printf '%s  %s\n' ed8eac52c06daa12fdbc830b9d277e0d0a9181806a90f6df33c2152a6a629257 "$archive" | sha256sum --check
          printf '%s\n' 'Единая панель администратора и категории идей.' > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "$archive" "$out/astra-journey-web.json" \
            --target "$source_commit" --latest=false --title 'MATRIX × STUDIO Web v0.31.11' \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$tag" --json isDraft,assets \
            --jq 'if (.isDraft or ([.assets[].name] | sort) != ["astra-journey-web-845d19cfd62a33d21ec47c83202e519cf67dc61d35e0042f92182530f7a3620a.zip", "astra-journey-web.json"]) then error("Unexpected release assets") else .assets[].name end'
