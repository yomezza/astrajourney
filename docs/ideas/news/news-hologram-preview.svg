<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" fill="none" role="img" aria-labelledby="np-preview-title np-preview-desc"><title id="np-preview-title">Голографический проектор новостей Cosmosimulator</title><desc id="np-preview-desc">Три световых потока от проекционного устройства: две новости и центральная кнопка «Все новости». Примерные новости только в этом превью.</desc>
