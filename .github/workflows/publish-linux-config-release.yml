name: Publish Linux planetary connection fix
on:
  push:
    branches: [main]
    paths: ['.github/linux-release-request.json']
permissions:
  contents: write
concurrency:
  group: publish-linux-config-release
  cancel-in-progress: false
jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate requested tag
        run: |
          set -euo pipefail
          tag="$(python3 - <<'PY'
          import json,re
          with open('.github/linux-release-request.json',encoding='utf-8') as stream:
              request=json.load(stream)
          tag=request['tag']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag):
              raise SystemExit('invalid version tag')
          print(tag)
          PY
          )"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Test planetary websocket deadline and browser liveness fixes
        run: |
          set -euo pipefail
          go test ./internal/planetserver ./internal/server -run '^(TestPlanetHTTPServerDoesNotExpireHijackedWebSockets|TestCosmicHTTPDeadlinesKeepProxiedWebSocketsAlive)$' -count=1
          node --test tests/ui/planet-liveness.test.mjs
      - name: Build Cosmic and Planet for Linux amd64
        run: |
          set -euo pipefail
          python3 scripts/build-release.py "$RELEASE_TAG" --platform linux --service cosmos --service planet --source-ref "$GITHUB_SHA"
          (
            cd downloads
            sha256sum "astra-journey-$RELEASE_TAG-linux-amd64" \
                      "astra-journey-planet-$RELEASE_TAG-linux-amd64" \
                      "astra-journey-$RELEASE_TAG-build.json"
          ) > "$RUNNER_TEMP/SHA256SUMS"
      - name: Publish Linux-only release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Astra Journey 0.25.3 — исправление циклических переподключений Planet

          - Planet: устранены HTTP read/write-дедлайны 10 секунд, унаследованные долгоживущими WebSocket после upgrade.
          - Cosmic: проксируемые Planet и Chat WebSocket не ограничены 15-секундным HTTP-дедлайном; обычные HTTP-запросы по-прежнему ограничены.
          - Браузер: учтена подготовка сцены до 60 секунд и введено контрольное resync перед отключением молчащего WebSocket.
          - Добавлены адресные Go/JavaScript-тесты; миграций БД и изменений игровой механики нет.
          - Собраны только Cosmic и Planet для Linux amd64. **Chat v0.25.2 остаётся актуальным**, обновлять его не требуется.

          Замените Cosmic и Planet одновременно, перезапустите службы и обновите страницу игры.
          EOF
          gh release create "$RELEASE_TAG" \
            "downloads/astra-journey-$RELEASE_TAG-linux-amd64" \
            "downloads/astra-journey-planet-$RELEASE_TAG-linux-amd64" \
            "downloads/astra-journey-$RELEASE_TAG-build.json" \
            "$RUNNER_TEMP/SHA256SUMS" \
            configs/cosmos.example.toml \
            configs/planet.example.toml \
            configs/chat.example.toml \
            configs/shared.example.toml \
            --target "$GITHUB_SHA" \
            --title "Astra Journey $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
