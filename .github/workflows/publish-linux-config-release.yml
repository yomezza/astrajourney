name: Publish Linux Planet WebSocket stability fix
on:
  push:
    branches: [main]
    paths: ['.github/linux-release-request.json']
permissions:
  contents: write
concurrency:
  group: publish-linux-config-release
  cancel-in-progress: false
jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate requested tag
        run: |
          set -euo pipefail
          tag="$(python3 - <<'PY'
          import json,re
          with open('.github/linux-release-request.json',encoding='utf-8') as stream:
              request=json.load(stream)
          tag=request['tag']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag):
              raise SystemExit('invalid version tag')
          print(tag)
          PY
          )"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Run targeted WebSocket lifecycle and client checks
        run: |
          set -euo pipefail
          go test ./internal/planetserver ./internal/server -run '^(TestPlanetWebSocketLifetimeIgnoresHTTPRequestCancellation|TestPlanetWebSocketLifetimeReleaseCloses|TestPlanetHTTPServerDoesNotExpireHijackedWebSockets|TestCosmicHTTPDeadlinesKeepProxiedWebSocketsAlive)$' -count=1 -timeout=3m
          node --check internal/server/web/features/planet/visit.js
          node --test tests/ui/planet-liveness.test.mjs
      - name: Build Linux amd64 Cosmic and Planet from tested commit
        run: |
          set -euo pipefail
          python3 scripts/build-release.py "$RELEASE_TAG" --platform linux --service cosmos --service planet --source-ref "$GITHUB_SHA"
          (
            cd downloads
            sha256sum "astra-journey-$RELEASE_TAG-linux-amd64" \
                      "astra-journey-planet-$RELEASE_TAG-linux-amd64" \
                      "astra-journey-$RELEASE_TAG-build.json"
          ) > "$RUNNER_TEMP/SHA256SUMS"
      - name: Publish Linux release after successful tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Astra Journey 0.25.4 — Planet WebSocket lifecycle и диагностика

          - Planet WS теперь не наследует отмену HTTP-запроса после upgrade; сохраняется остановка по жизненному циклу службы.
          - Planet пишет в серверный журнал structured cause, длительность и epoch завершившейся WebSocket-сессии, чтобы диагностировать код 1006.
          - Браузер различает ошибку обработки кадра и сетевой разрыв, пишет возраст соединения и локальную причину закрытия.
          - CSP не ослаблялась; миграции БД и игровые правила не изменялись.
          - Linux amd64 Cosmic и Planet собраны из одного коммита. Chat v0.25.2 остаётся совместимым.

          Обновите Cosmic и Planet, перезапустите обе службы и обновите страницу игры.
          Если соединение всё ещё обрывается, пришлите серверные строки 'planet websocket ended' и объект 'Planet WS disconnected' из консоли браузера.
          EOF
          gh release create "$RELEASE_TAG" \
            "downloads/astra-journey-$RELEASE_TAG-linux-amd64" \
            "downloads/astra-journey-planet-$RELEASE_TAG-linux-amd64" \
            "downloads/astra-journey-$RELEASE_TAG-build.json" \
            "$RUNNER_TEMP/SHA256SUMS" \
            configs/cosmos.example.toml \
            configs/planet.example.toml \
            configs/chat.example.toml \
            configs/shared.example.toml \
            --target "$GITHUB_SHA" \
            --title "Astra Journey $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
