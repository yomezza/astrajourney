# Скопируйте в cosmos.toml, заполните url и задайте CONFIG_FILE полным путём.
# Этот пример для HTTP в LAN, все три процесса работают на одном компьютере.
[database]
url = 'postgres://cosmos:CHANGE_ME@127.0.0.1:5432/existing_database?sslmode=disable'
schema = 'astra_journey' # Новая установка; при обновлении сохраните прежнее имя схемы.

[cosmos]
http_addr = '0.0.0.0:8080'
public_origin = 'http://192.168.111.44:8080' # Адрес, который игрок открывает в браузере.
cookie_secure = false # Для HTTPS установите true.
trusted_proxies = []
planet_enabled = true
planet_internal_url = 'http://127.0.0.1:8081'
chat_enabled = true
chat_internal_url = 'http://127.0.0.1:8082'

# Только для первоначального создания администратора; затем уберите реквизиты.
[admin]
username = ''
password = ''

# Cosmic 0.24.13 / N6. Отдельный профиль, отключён по умолчанию.
# Loopback-порт ниже принадлежит изолированному TLS стенду, не рабочему cosmoNATS.
[nats]
enabled = false
service_identity = 'cosmos'
servers = ['tls://127.0.0.1:14222']
username = 'cosmos'
password_file = '../secrets/cosmos.password'
ca_file = '../certs/ca.pem'
connect_timeout = '2s'
reconnect_wait = '1s'

# С 0.24.13: для подключения без TLS используйте nats://host:4222,
# удалите ca_file/password_file и задайте password = 'YOUR_NATS_PASSWORD'.
# Общий конфиг трёх служб: shared.example.toml.
