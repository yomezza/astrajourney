# Скопируйте в chat.toml. Используйте отдельный ограниченный логин Chat.
[database]
url = 'postgres://chat_runtime:CHANGE_ME@127.0.0.1:5432/existing_database?sslmode=disable'
schema = 'astra_journey'

[chat]
http_addr = '127.0.0.1:8082'
cosmic_internal_url = 'http://127.0.0.1:8080'
planet_internal_url = 'http://127.0.0.1:8081'
allowed_origins = ['http://192.168.111.44:8080']
# Путь относительно TOML; заранее создайте каталог и сохраните старый журнал.
erasure_journal = '../data/chat-erasure.log'

# Chat 0.24.13: legacy (default), a1 (local), a2 (LISTEN), b1 (Core NATS).
# A2 is test-only until separate approval of the DBA trigger/migration rollout.
# No trigger is installed by this executable; polling remains mandatory.
# Use a separate Chat config: older Cosmic/Planet EXEs reject these new keys.
dispatcher_mode = 'legacy'
fallback_poll_interval = '10s'
degraded_poll_interval = '2s'
outbox_overlap = '60s'

# Необязательное переопределение database.url для процесса Chat:
# database_url = 'postgres://chat_runtime:CHANGE_ME@127.0.0.1:5432/existing_database?sslmode=disable'
# Для отдельной задачи --maintain или настроенного обслуживания секций:
# maintenance_database_url = 'postgres://PARTITION_OWNER:CHANGE_ME@127.0.0.1:5432/existing_database?sslmode=disable'
# Только в отдельном DBA-конфиге для однократной команды --grant-runtime:
# runtime_role = 'chat_runtime'
# definer_role = 'chat_definer'

# N6: separate Cosmos/Planet/Chat profiles. Never share credentials between services.
# Disabled by default. The loopback port below belongs to an isolated test broker.
# B1 requires enabled=true, existing protected files and verified broker TLS/auth.
[nats]
enabled = false
service_identity = 'chat'
servers = ['tls://127.0.0.1:14222']
username = 'chat'
password_file = '../secrets/chat.password'
ca_file = '../certs/ca.pem'
connect_timeout = '2s'
reconnect_wait = '1s'

# С 0.24.13: для подключения без TLS используйте nats://host:4222,
# удалите ca_file/password_file и задайте password = 'YOUR_NATS_PASSWORD'.
# Общий конфиг трёх служб: shared.example.toml.
