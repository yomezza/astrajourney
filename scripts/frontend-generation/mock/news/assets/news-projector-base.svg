<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" fill="none" role="img" aria-labelledby="np-base-title np-base-desc"><title id="np-base-title">Новостной проектор</title><desc id="np-base-desc">Компактная физическая голографическая установка с энергетическим ядром и тремя излучателями.</desc>
<!-- news-component:begin -->

<defs>
<linearGradient id="np-base-metal" x1="0" x2=".25" y1="0" y2="1"><stop stop-color="#41616b"/><stop offset=".35" stop-color="#263d4a"/><stop offset="1" stop-color="#0b1722"/></linearGradient>
<linearGradient id="np-base-inset" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#163e48"/><stop offset="1" stop-color="#09242f"/></linearGradient>
<radialGradient id="np-base-core"><stop stop-color="#d4ffef" stop-opacity=".93"/><stop offset=".25" stop-color="#85e8d6" stop-opacity=".8"/><stop offset=".66" stop-color="#209da7" stop-opacity=".3"/><stop offset="1" stop-color="#209da7" stop-opacity="0"/></radialGradient>
<filter id="np-base-glow" x="-35%" y="-80%" width="170%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
@keyframes np-base-breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes np-base-scan{from{stroke-dashoffset:0}to{stroke-dashoffset:-170}}
@keyframes np-base-ring{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.85;transform:scale(1.045)}}
.np-base-core{animation:np-base-breathe 4.8s ease-in-out infinite}
.np-base-scan{animation:np-base-scan 5s linear infinite}
.np-base-ring{transform-box:fill-box;transform-origin:center;animation:np-base-ring 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.np-base-core,.np-base-scan,.np-base-ring{animation:none!important;transform:none!important}}
</style>
