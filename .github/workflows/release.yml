name: Publish release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files
        run: |
          set -euo pipefail
          sha256sum -c downloads/SHA256SUMS
          test -f "release-notes/$RELEASE_TAG.md"
          found=false
          for suffix in '' '-planet' '-chat'; do
            linux="downloads/astra-journey${suffix}-${RELEASE_TAG}-linux-amd64"
            if test -f "$linux"; then
              found=true
            fi
          done
          test "$found" = true
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish Linux amd64 binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          executables=()
          for suffix in '' '-planet' '-chat'; do
            linux="downloads/astra-journey${suffix}-${RELEASE_TAG}-linux-amd64"
            if test -f "$linux"; then
              executables+=("$linux")
            fi
          done
          if test -f "downloads/astra-journey-${RELEASE_TAG}-build.json"; then
            executables+=("downloads/astra-journey-${RELEASE_TAG}-build.json")
          fi
          gh release create "$RELEASE_TAG" \
            "${executables[@]}" \
            configs/cosmos.example.toml \
            configs/planet.example.toml \
            configs/chat.example.toml \
            configs/shared.example.toml \
            downloads/SHA256SUMS \
            --verify-tag \
            --title "Astra Journey $RELEASE_TAG" \
            --notes-file "release-notes/$RELEASE_TAG.md"
